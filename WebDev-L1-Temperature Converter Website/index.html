<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="converter-card">

            <div class="header">
                <div class="temperature-icon">🌡️</div>
                <h1>Temperature Converter</h1>
                <p>Convert temperatures quickly and accurately</p>
            </div>

            <form id="converterForm">

                <div class="input-group">
                    <label for="temperature">Temperature</label>
                    <input
                        type="text"
                        id="temperature"
                        placeholder="Enter temperature"
                        autocomplete="off"
                    >
                    <small id="inputError" class="error-message"></small>
                </div>

                <div class="input-group">
                    <label for="unit">Input Unit</label>
                    <select id="unit">
                        <option value="celsius">Celsius (°C)</option>
                        <option value="fahrenheit">Fahrenheit (°F)</option>
                        <option value="kelvin">Kelvin (K)</option>
                    </select>
                </div>

                <button type="submit" id="convertBtn">
                    Convert Temperature
                </button>

            </form>

            <div id="result" class="result hidden">
                <h2>Conversion Results</h2>

                <div class="result-grid">

                    <div class="result-box">
                        <span class="result-icon">🌡️</span>
                        <div>
                            <p>Celsius</p>
                            <strong id="celsiusResult">--</strong>
                        </div>
                    </div>

                    <div class="result-box">
                        <span class="result-icon">🔥</span>
                        <div>
                            <p>Fahrenheit</p>
                            <strong id="fahrenheitResult">--</strong>
                        </div>
                    </div>

                    <div class="result-box">
                        <span class="result-icon">❄️</span>
                        <div>
                            <p>Kelvin</p>
                            <strong id="kelvinResult">--</strong>
                        </div>
                    </div>

                </div>
            </div>

            <div id="absoluteZeroError" class="absolute-zero hidden">
                <strong>⚠️ Invalid Temperature</strong>
                <p>
                    The temperature cannot be below absolute zero
                    (−273.15°C / −459.67°F / 0 K).
                </p>
            </div>

            <div class="footer">
                <p>Supports Celsius, Fahrenheit & Kelvin</p>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
